<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI-GPT</title>
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Arquivo CSS Externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Faixa Lateral Vermelha -->
    <div class="sidebar"></div>

    <!-- Container Conteúdo -->
    <div class="main-container">
        
        <!-- Botões do Canto Superior Direito -->
        <div class="top-controls">
            <!-- Botão Alternar Tema (Claro/Escuro) -->
            <button class="icon-btn" id="themeToggleBtn" title="Alternar Tema Claro/Escuro">
                <i class="fa-solid fa-moon"></i>
            </button>
            
            <!-- Botão de registro -->
            <button class="register-btn" id="loginBtn" title="Register">
                Register
            </button>
        </div>

        <!-- Bloco Central -->
        <div class="content">
            <img src="Icon.png" alt="">

            <!-- Título -->
            <h1 class="title">SENAI-GPT</h1>

            <!-- Input do Chat -->
            <div class="input-wrapper">
                <input type="text" id="userInput" class="chat-input" placeholder="Pergunte algo..." autocomplete="off">
                <button class="send-btn" id="sendBtn" title="Enviar">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

            <!-- Logo SENAI -->
            <div class="senai-logo">
                SENAI
            </div>
        </div>
    </div>

    <!-- Modal de Login -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Área de Login</h2>
            <form id="loginForm">
                <input type="email" placeholder="E-mail" required>
                <input type="password" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = themeToggleBtn.querySelector('i');
        const loginBtn = document.getElementById('loginBtn');
        const loginModal = document.getElementById('loginModal');
        const closeModal = document.getElementById('closeModal');
        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');

            if (document.body.classList.contains('dark-mode')) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        });

        loginBtn.addEventListener('click', () => {
            loginModal.style.display = 'flex';
        });

        closeModal.addEventListener('click', () => {
            loginModal.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target === loginModal) {
                loginModal.style.display = 'none';
            }
        });

        function sendMessage() {
            const text = userInput.value.trim();
            if (text !== '') {
                alert(`Mensagem enviada: "${text}"`);
                userInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
